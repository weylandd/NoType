<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Aura — конвейер распознавания голоса</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1c1c1c;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #e5e5e5;
    --muted: #8a8a8a;
    --dim: #555;
    --accent: #ff6b35;
    --accent-soft: rgba(255, 107, 53, 0.12);
    --cached: #4ade80;
    --cached-soft: rgba(74, 222, 128, 0.10);
    --variable: #fbbf24;
    --variable-soft: rgba(251, 191, 36, 0.10);
    --info: #60a5fa;
    --info-soft: rgba(96, 165, 250, 0.10);
    --error: #ef4444;
    --new: #c084fc;
    --new-soft: rgba(192, 132, 252, 0.10);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-soft); color: var(--text); }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  header {
    grid-column: 1 / 3;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
  }

  .logo {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo::before {
    content: "";
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 14px var(--accent);
  }
  .logo small {
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }
  .logo .v {
    margin-left: 8px;
    font-size: 10px;
    color: var(--new);
    background: var(--new-soft);
    border: 1px solid rgba(192,132,252,0.25);
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .controls {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }
  .control-group label {
    color: var(--muted);
    font-size: 12px;
    padding: 0 8px;
  }
  .control-group button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 4px 10px;
    font: inherit;
    font-size: 12px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 120ms;
  }
  .control-group button:hover { color: var(--text); }
  .control-group button.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* sidebar */
  aside {
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }

  .step-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .step {
    position: relative;
    padding: 10px 18px 10px 44px;
    cursor: pointer;
    color: var(--muted);
    border-left: 2px solid transparent;
    transition: all 120ms;
    user-select: none;
  }
  .step:hover { color: var(--text); background: rgba(255,255,255,0.02); }
  .step.active {
    color: var(--text);
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .step .num {
    position: absolute;
    left: 14px;
    top: 12px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    display: grid;
    place-items: center;
    background: var(--panel);
  }
  .step.active .num {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .step.passed .num {
    background: rgba(74, 222, 128, 0.15);
    border-color: var(--cached);
    color: var(--cached);
  }
  .step .label {
    font-size: 13px;
    line-height: 1.3;
  }
  .step .sub {
    display: block;
    font-size: 11px;
    color: var(--dim);
    margin-top: 2px;
    font-family: var(--mono);
  }
  .step .changed {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--new);
    margin-left: 6px;
    vertical-align: 2px;
  }

  /* main */
  main {
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto;
    height: calc(100vh - 56px);
  }

  .stage {
    overflow-y: auto;
    padding: 28px 36px 24px;
  }

  .stage h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .stage .stage-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft);
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .stage .stage-tag.changed {
    color: var(--new);
    background: var(--new-soft);
    border-color: rgba(192,132,252,0.3);
  }
  .stage h2 {
    margin: 24px 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
  }
  .stage p { margin: 0 0 12px; color: #cfcfcf; }
  .stage p strong { color: var(--text); font-weight: 600; }

  code, kbd {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    color: #eaeaea;
  }
  kbd {
    background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4);
    color: var(--text);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .card.flat { background: var(--panel-2); }
  .card .k {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .card .v {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }

  pre.code {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    margin: 8px 0 16px;
    color: #d4d4d4;
  }
  pre.code .com { color: #6b7280; font-style: italic; }
  pre.code .kw  { color: #c084fc; }
  pre.code .str { color: #86efac; }
  pre.code .num { color: #fbbf24; }
  pre.code .fn  { color: #60a5fa; }
  pre.code .key { color: #f97316; }

  .seg {
    border-radius: 8px;
    padding: 8px 12px;
    margin: 4px 0;
    font-family: var(--mono);
    font-size: 12px;
    border: 1px solid;
  }
  .seg.cached  { background: var(--cached-soft);   border-color: rgba(74,222,128,0.3);  color: #a7f3c5; }
  .seg.variable{ background: var(--variable-soft); border-color: rgba(251,191,36,0.3);  color: #fde68a; }
  .seg.new     { background: var(--new-soft);      border-color: rgba(192,132,252,0.35); color: #e9d5ff; }
  .seg .lbl {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .seg.cached  .lbl { background: rgba(74,222,128,0.2); color: var(--cached); }
  .seg.variable .lbl { background: rgba(251,191,36,0.2); color: var(--variable); }
  .seg.new      .lbl { background: rgba(192,132,252,0.2); color: var(--new); }

  /* state machine diagram */
  .sm {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 8px 0 16px;
  }
  .sm-node {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .sm-arrow {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    text-align: center;
    padding: 0 4px;
  }
  .sm-arrow small { display: block; font-size: 10px; color: var(--muted); }

  /* prompt panel */
  .prompt-panel {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 36px 18px;
    max-height: 38vh;
    overflow-y: auto;
  }
  .prompt-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .prompt-head h3 {
    margin: 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
  }
  .prompt-head .badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--info-soft);
    color: var(--info);
    border: 1px solid rgba(96,165,250,0.25);
  }
  .copy-btn {
    margin-left: auto;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 5px 10px;
    font: 500 12px var(--sans);
    cursor: pointer;
    transition: all 120ms;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { background: rgba(74,222,128,0.15); border-color: var(--cached); color: var(--cached); }

  .prompt-body {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    color: #d4d4d4;
    max-height: 28vh;
    overflow-y: auto;
  }

  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    margin: 6px 0 14px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: 1px;
    border: 1px solid;
  }
  .legend .cached { background: var(--cached-soft); border-color: rgba(74,222,128,0.4); }
  .legend .variable { background: var(--variable-soft); border-color: rgba(251,191,36,0.4); }
  .legend .new { background: var(--new-soft); border-color: rgba(192,132,252,0.4); }

  .callout {
    background: var(--info-soft);
    border-left: 3px solid var(--info);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    margin: 10px 0;
    color: #cfe2ff;
    font-size: 13px;
  }
  .callout.warn { background: rgba(251,191,36,0.06); border-color: var(--variable); color: #fde68a; }
  .callout.danger { background: rgba(239,68,68,0.08); border-color: var(--error); color: #fca5a5; }
  .callout.new { background: var(--new-soft); border-color: var(--new); color: #e9d5ff; }
  .callout strong { color: inherit; font-weight: 600; }

  ul.tight { padding-left: 18px; margin: 6px 0 14px; }
  ul.tight li { margin: 2px 0; color: #cfcfcf; }
  ul.tight code { font-size: 12px; }

  /* waveform mock */
  .wave {
    height: 60px;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 2px;
    margin: 8px 0 12px;
    overflow: hidden;
  }
  .wave .bar {
    flex: 1;
    background: var(--dim);
    border-radius: 1px;
    min-height: 3px;
    transition: background 200ms;
  }
  .wave .bar.voiced { background: var(--accent); }
  .wave .bar.preroll { background: var(--variable); opacity: 0.6; }

  /* insertion target visual */
  .insertion-display {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin: 8px 0 12px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: #d4d4d4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .insertion-display .before {
    color: #8e9aaf;
    background: rgba(96,165,250,0.06);
    padding: 1px 2px;
    border-radius: 2px;
  }
  .insertion-display .after {
    color: #8e9aaf;
    background: rgba(96,165,250,0.06);
    padding: 1px 2px;
    border-radius: 2px;
  }
  .insertion-display .cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: var(--accent);
    margin: 0 1px -3px;
    animation: blink 1.05s steps(2, end) infinite;
    box-shadow: 0 0 6px var(--accent);
  }
  @keyframes blink {
    50% { opacity: 0.2; }
  }
  .insertion-display .insertion-zone {
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 4px;
    border-radius: 3px;
    border: 1px dashed rgba(255,107,53,0.4);
    font-style: italic;
  }
  .insertion-display .label-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .insertion-display .label-row span {
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(96,165,250,0.10);
    color: var(--info);
  }
  .insertion-display .label-row span.zone {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Aura <small>· конвейер распознавания голоса</small><span class="v">v2 — insertion target</span></div>
    <div class="controls">
      <div class="control-group" id="chunk-control">
        <label>chunk</label>
        <button data-chunk="1" class="active">1</button>
        <button data-chunk="2">2</button>
        <button data-chunk="3">3</button>
        <button data-chunk="final">final</button>
      </div>
      <div class="control-group" id="app-control">
        <label>app</label>
        <button data-app="slack" class="active">Slack</button>
        <button data-app="mail">Mail</button>
        <button data-app="xcode">Xcode</button>
        <button data-app="notes">Notes</button>
      </div>
    </div>
  </header>

  <aside>
    <ul class="step-list" id="steps"></ul>
  </aside>

  <main>
    <section class="stage" id="stage"></section>
    <section class="prompt-panel">
      <div class="prompt-head">
        <h3 id="prompt-title">Что отправляется / что выполняется</h3>
        <span class="badge" id="prompt-badge">шаг</span>
        <button class="copy-btn" id="copy">Копировать</button>
      </div>
      <pre class="prompt-body" id="prompt"></pre>
    </section>
  </main>
</div>

<script>
/* ──────────────────────────────────────────────────────────────────
   Конфигурация шагов конвейера
   ────────────────────────────────────────────────────────────────── */

const APPS = {
  slack: {
    name: "Slack",
    bundle: "com.tinyspeck.slackmacgap",
    style: "casualChat",
    insertionBefore: "Hey John, thanks for the update — ",
    insertionAfter: "",
    axSample:
`Window: "engineering — Acme Corp"
  Channel list:
    - #engineering
    - #design
    - #random
  Conversation:
    Alice [10:32 AM]: "did you see the spec?"
    Me [10:35 AM]: "looking now"
  Compose: <focused — see Insertion target>`
  },
  mail: {
    name: "Mail",
    bundle: "com.apple.mail",
    style: "formalEmail",
    insertionBefore: "Hi Sarah,\n\nThanks for the Q3 plan — I think the timeline ",
    insertionAfter: " before lunch on Friday.",
    axSample:
`Window: "Inbox — me@example.com"
  Toolbar: "New Message", "Reply", "Forward"
  Mailbox list:
    - Inbox (12)
    - Sent
    - Drafts
  Composer (focused):
    To: sarah@acme.com
    Subject: "Re: Q3 plan"
    Body: <see Insertion target>`
  },
  xcode: {
    name: "Xcode",
    bundle: "com.apple.dt.Xcode",
    style: "codeComment",
    insertionBefore: "// TODO: ",
    insertionAfter: "",
    axSample:
`Window: "Aura — RecordingSession.swift"
  Navigator:
    - Aura/
      - Recording/
        - AudioRecorder.swift
        - SileroVAD.swift  ← open
        - PauseDetector.swift
  Editor (Swift, focused, ~1400/2000 chars shown):
    func consumeFrame(_ samples: [Float]) async {
        let p = await vad.classify(samples)
        events.send(p > threshold ? .voiced : .silent)
    }
    // [truncated at 2000 chars]`
  },
  notes: {
    name: "Notes",
    bundle: "com.apple.Notes",
    style: "neutral",
    insertionBefore: "• pre-roll 300ms\n• pause threshold 1.0s\n• ",
    insertionAfter: "",
    axSample:
`Window: "Notes — Меморандум проекта"
  Sidebar:
    - All iCloud
    - Quick Notes
    - Aura design  ← active
  Note (focused):
    Title: "Aura design"
    Body: <see Insertion target>`
  }
};

/* ─────  v2: новый system instruction  ───── */
const SYSTEM_INSTRUCTION =
`You are the transcription engine for a macOS dictation app. Each request contains one audio chunk plus textual context assembled by the client. Your only output is the transcription of the current chunk's audio.

# How a session works

The user holds a hotkey while speaking. The client splits the audio at ≥1s pauses and sends each chunk as an independent generateContent request — this is NOT a chat. You never see your own past replies. The client stitches your text outputs together locally and inserts the result at the cursor inside the user's focused text field.

Within one session the cached prefix is identical across chunks. Only the per-chunk instruction line and the audio bytes change.

# Sections you will receive (in this order)

1. \`App:\` and \`Style hint:\` — destination application and a soft register hint.
2. \`Insertion target:\` — \`Text before cursor\` and \`Text after cursor\`. Your full session output will be inserted between these two strings, producing: \`<Text before cursor><session output><Text after cursor>\`.
3. \`On-screen context:\` — a redacted accessibility tree of the user's screen. Use only for disambiguation.
4. \`Prior chunks (this session):\` — text outputs you produced for earlier chunks of this same session. Treated by the client as immutable.
5. The per-chunk instruction line and the audio.

# Output contract

- Output only the words spoken in the current chunk's audio. Nothing else: no prefixes, no quotation marks, no markdown, no language tags, no "[inaudible]" markers, no explanations.
- Never re-emit, paraphrase, or "fix" prior chunks.
- Never quote, describe, or echo any content from \`On-screen context\`, \`Insertion target\`, or \`App\`.
- Transcribe in the language actually spoken. Detect from audio. If the speaker code-switches, follow them word for word at the same boundary.
- If a stretch is genuinely unintelligible, drop it silently. Do not guess. Do not insert brackets or markers.

# Cleanup level (light, Wispr Flow style)

- Remove obvious filler words in any language: "um", "uh", filler "like", "э-э", "ну", "это самое", and equivalents.
- Collapse self-corrections: when the speaker abandons a phrase and restarts, keep only the corrected version. Example: "let me, um, let me check on that" → "let me check on that".
- Otherwise preserve the speaker's exact words, word order, register, and sentence shape. No paraphrasing, no synonym swaps, no reordering, no summarising.

# Punctuation across chunk boundaries

A spoken sentence is often cut by a chunk boundary. The client may discard or adjust trailing punctuation when stitching, so be conservative:

- If the current chunk ends mid-thought — on a preposition, conjunction, dangling subject, or any place where a competent writer would not put a period — DO NOT emit terminal punctuation (\`.\`, \`!\`, \`?\`). End mid-phrase. Commas, dashes, colons, and quotation marks are allowed.
- If the current chunk reads as a complete sentence in itself, terminal punctuation is allowed.
- Chunks are concatenated by the client with no inserted whitespace. If the prior chunk ends with a non-whitespace character and your audio starts a new word, begin your output with a leading space. If a prior chunk ends mid-word (rare — VAD cut inside a word), continue spelling that word without restarting it.

# Insertion target — your output goes between two fixed pieces of text

After the session, the client will produce: \`<Text before cursor><full session output><Text after cursor>\`. Your text must make this concatenation read as one natural piece. Three rules:

**1. Start capitalization.** If \`Text before cursor\` is empty, or its last non-whitespace character is \`.\`, \`!\`, or \`?\`, start your first chunk with a capital letter as a new sentence. Otherwise — including endings like \`,\`, \`:\`, \`—\`, \`;\`, or no terminal punctuation at all — start in lowercase and continue the existing sentence.

**2. Whitespace boundaries.** Do not duplicate or eat whitespace.
- If \`Text before cursor\` is empty or ends with whitespace, do NOT begin your output with a leading space.
- If it ends with a non-whitespace character, DO begin your output with a leading space (unless audio clearly continues the same word mid-syllable).
- If \`Text after cursor\` is non-empty and starts with a non-whitespace character, end your final chunk with a trailing space. Otherwise, do not.

**3. End punctuation.** Match the register and continuation pattern of \`Text after cursor\`:
- If \`Text after cursor\` is empty, OR its first non-whitespace character is a capital letter starting a new sentence — close with terminal punctuation as you naturally would.
- If \`Text after cursor\` continues mid-sentence (starts with a lowercase word, a conjunction, a comma, or any continuation marker) — prefer ending the final chunk with a comma or no punctuation. The client may strip a trailing terminal mark if needed; do not panic if you emitted one.

\`Text after cursor\` is FIXED. Never modify, paraphrase, summarize, repeat, or echo it. Do not include any of its words in your output.

If \`Insertion target\` is empty or both \`Text before cursor\` and \`Text after cursor\` are empty, treat the session as opening a fresh sentence in an empty field.

# Using on-screen context

\`On-screen context\` is for disambiguation only. Use it to:

- Resolve proper nouns the speaker mentions (people, products, project, channel, file names).
- Spell jargon, code identifiers, library names, commands visible on screen.
- Choose the correct spelling for code-switched terms whose orthography depends on surrounding language.

The audio always wins over the on-screen context. Never insert any phrase from \`On-screen context\` that the speaker did not actually say.

# Style hint

Values like \`casualChat\`, \`formalEmail\`, \`codeComment\`, \`neutral\` are a soft hint about the destination. Adjust punctuation density and capitalization habits slightly to fit. Do not change the speaker's words. Hint, not command.`;

function highlightSwift(src) {
  return src
    .replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>')
    .replace(/\b(let|var|func|guard|return|if|else|while|for|in|await|async|throws|try|actor|struct|enum|class|case|self|true|false|nil|where)\b/g, '<span class="kw">$1</span>')
    .replace(/("[^"]*")/g, '<span class="str">$1</span>')
    .replace(/\b(\d+(\.\d+)?(_\d+)*)\b/g, '<span class="num">$1</span>');
}

function highlightJSON(src) {
  return src
    .replace(/("[^"]*"\s*:)/g, '<span class="key">$1</span>')
    .replace(/(:\s*)("[^"]*")/g, '$1<span class="str">$2</span>')
    .replace(/\b(true|false|null)\b/g, '<span class="kw">$1</span>')
    .replace(/(\b\d+(\.\d+)?\b)/g, '<span class="num">$1</span>');
}

function escapeHTML(s) {
  return s
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeForJSON(s) {
  return s
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r")
    .replace(/\t/g, "\\t");
}

    <ul class="tight">
      <li><strong>До кодирования:</strong> если граница чанка N+1 пришла, пока N ещё кодируется в m4a — отдельный чанк не создаётся, аудио продлевает N. Pre-encoding auto-coalesce (на уровне <code>PauseDetector</code>).</li>
      <li><strong>После кодирования:</strong> N+1 (PCM-диапазон, ещё не закодированный) попадает в FIFO <code>pending</code>. Когда sender просыпается, он берёт <em>всё</em>, что накопилось.</li>

    <pre class="code">${highlightSwift(`func finalizeForInsertion(_ stitched: String, textAfterCursor: String) -> String {
    var out = stitched

    let trimmedRight = textAfterCursor.trimmingCharacters(in: .whitespaces)
    let continuesMidSentence: Bool = {
        guard let first = trimmedRight.first else { return false }   // empty → keep punct
        if first.isLowercase { return true }
        if [",", ";", ":", "—", "-"].contains(first) { return true }
        return false                                                 // capital / terminal → new sentence
    }()

    if continuesMidSentence {
        let pattern = #"[.!?]\\s*$"#
        if let range = out.range(of: pattern, options: .regularExpression) {
            out.removeSubrange(range)
        }
    }

    return out
}`)}</pre>

    <ol style="padding-left:18px;color:#cfcfcf">
      <li>stitched транскрипт → <code>finalizeForInsertion</code> → текст готов.</li>
      <li>Транскрипт вставлен через ⌘V.</li>
      <li><code>HistoryStore.append(entry)</code>.</li>
      <li><code>AudioRecorder.stop()</code>; ring-буфер обнуляется.</li>
      <li><code>RecordingSession</code> отбрасывается (deinit).</li>
      <li>Иконка в меню-баре — обратно в <code>mic</code> (template).</li>
      <li>HUD свёрнут.</li>
    </ol>

    <p>Aura снова в покое. Готова к следующему нажатию Right Option.</p>
  `;

  }
}

/* ──────────────────────────────────────────────────────────────────
   Промпт / нижняя панель
   ────────────────────────────────────────────────────────────────── */

function buildGeminiRequest(chunk) {
  const app = APPS[state.app];
  const isFinal = chunk === "final";
  const chunkNum = isFinal ? (PRIOR_CHUNKS.final.length + 1) : Number(chunk);
  const priors = PRIOR_CHUNKS[chunk] || [];
  const priorsText = priors.length === 0
    ? "(none yet)"
    : priors.map((t, i) => `  chunk_${i + 1}: "${t.trim()}"`).join("\n");

  const instructionFinal =
    `Now transcribe chunk_${chunkNum}. is_final=true. This is the last chunk of the session. Output only the words spoken in this chunk's audio. Apply final punctuation as natural for the spoken phrase, taking \`Text after cursor\` into account per the Insertion target rules. Do not repeat or re-emit any earlier chunks. Do not echo any text from \`Text after cursor\`.`;
  const instructionMid =
    `Now transcribe chunk_${chunkNum}. is_final=false. Output only the words spoken in this chunk's audio. If the phrase ends mid-thought, omit terminal punctuation (. ! ?).`;

  const insertionBlock =
`Insertion target:
  Text before cursor: "${escapeForJSON(app.insertionBefore)}"
  Text after cursor: "${escapeForJSON(app.insertionAfter)}"`;

  const onScreenBlock =
`On-screen context:
${app.axSample}`;

  const priorBlock =
`Prior chunks (this session):
${priorsText}`;

  return `POST https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=<API_KEY>
Content-Type: application/json

{
  "system_instruction": {
    "parts": [
      { "text": "<see SYSTEM_INSTRUCTION constant — ~1100 tokens, identical across all sessions>" }
    ]
  },
  "contents": [
    {
      "role": "user",
      "parts": [
        // ─────────── cached prefix (identical across chunks of THIS session) ───────────
        { "text": "App: ${app.name} (${app.bundle})\\nStyle hint: ${app.style}" },

        { "text": "${escapeForJSON(insertionBlock)}" },

        { "text": "${escapeForJSON(onScreenBlock)}" },

        { "text": "${escapeForJSON(priorBlock)}" },

        // ─────────── variable suffix (per chunk) ───────────
        { "text": "${escapeForJSON(isFinal ? instructionFinal : instructionMid)}" },

        { "inline_data": { "mime_type": "audio/mp4", "data": "<base64-encoded m4a, ~${(chunkNum * 8).toFixed(0)} KB>" } }
      ]
    }
  ],
  "generationConfig": {
    "thinkingConfig": { "thinkingLevel": "minimal" },
    "temperature": 0.2,
    "responseMimeType": "text/plain"
  }
}`;
}

function promptFor(id) {
  const app = APPS[state.app];

  switch (id) {
    case "idle": return {

`# HotkeyMonitor — фоновой цикл

Thread:    "app.aura.hotkey"  (qos: .userInteractive)
RunLoop:   собственный, не main
EventTap:  CGEvent.tapCreate(
             tap: .cgSessionEventTap,
             place: .headInsertEventTap,
             options: .listenOnly,
             eventsOfInterest: 1 << CGEventType.flagsChanged.rawValue,
             callback: handleEvent,
             userInfo: refcon

while (CFRunLoopRun()) {
  // ждём событий flagsChanged
  // на tapDisabledByTimeout — re-enable
}`

    case "press": return {
      title: "Callback хоткея",
      badge: "C function pointer",
      body:
`let callback: CGEventTapCallBack = { _, type, event, refcon in
    guard let refcon else { return Unmanaged.passUnretained(event) }

    if type == .tapDisabledByTimeout || type == .tapDisabledByUserInput {
        let monitor = Unmanaged<HotkeyMonitor>.fromOpaque(refcon).takeUnretainedValue()
        CGEvent.tapEnable(tap: monitor.tap, enable: true)
        return Unmanaged.passUnretained(event)
    }

    let monitor = Unmanaged<HotkeyMonitor>.fromOpaque(refcon).takeUnretainedValue()
    monitor.handleEvent(event)
    return Unmanaged.passUnretained(event)        // listenOnly — пропускаем дальше
}

// внутри monitor.handleEvent:
let rightOptionBit: UInt64 = 0x40
let prev = previousFlags & rightOptionBit != 0
let curr = event.flags.rawValue & rightOptionBit != 0
previousFlags = event.flags.rawValue

if !prev && curr {
    Task { @MainActor in delegate?.onPress() }       // → создаём RecordingSession
} else if prev && !curr {
    Task { @MainActor in delegate?.onRelease() }     // → отправляем финальный чанк

    };

    case "session": return {
      title: "RecordingSession.start() — ждём контекст",
      badge: "@MainActor · v2",
      body:
`@MainActor
final class RecordingSession {
    var context: ContextSnapshot!
    var insertion: InsertionTarget!
    let recorder: AudioRecorder
    let geminiClient: GeminiClient
    var transcripts: [String] = []
    var lastChunkEnd: TimeInterval = 0

    func start() async throws {
        // audio capture стартует немедленно — пишем в ring buffer
        try await recorder.start()
        await vad.reset()

        // АКТИВНО ЖДЁМ контекст (v2 change). Hard timeout 250 ms.
        async let ctx       = ContextSnapshot.build()
        async let insertion = InsertionTarget.capture()

        do {
            self.context   = try await withTimeout(.milliseconds(250)) { try await ctx }
            self.insertion = try await withTimeout(.milliseconds(50))  { try await insertion }
        } catch is TimeoutError {
            // Fallback: пустой target / минимальный context. Секции в промпте остаются.
            self.context   = ContextSnapshot.empty
            self.insertion = InsertionTarget.empty
        }

        // VAD стримит события только теперь — гарантия что первый чанк

        Task.detached { [weak self] in

    case "audio": return {

`// 1 секунда речи в ring буфере:
samples = [-0.012, 0.034, 0.041, 0.022, ..., -0.008]   // 16 000 значений

    case "vad": return {

      body:
`// Inference pseudocode (per 32ms window):
input  = MLMultiArray(shape: [1, 512], dataType: .float32)
state  = previous LSTM hidden state
output = silero.predict(input, state)
prob   = output.scalar()                          // например, 0.87
state  = output.newState                          // сохраняем для следующего окна

// Поток вероятностей за ~5 секунд речи:
[
  0.01, 0.02, 0.04, 0.18, 0.62, 0.91, 0.94, 0.92, 0.88,    // ↑ начало "let me check"
  0.85, 0.71, 0.42, 0.18, 0.05, 0.04, 0.03, 0.02,           // → пауза 350 мс

    };

    case "pause": return {
      title: "Лента событий PauseDetector",
      badge: "AsyncStream<VADEvent>",
      body:
`t=0.000  feed(0.02)   → state Idle
t=0.032  feed(0.04)   → state Idle
...
t=0.480  feed(0.62)   → run=1
t=0.512  feed(0.91)   → run=2
t=0.544  feed(0.94)   → run=3 → state Speaking, chunkStart=0.480

t=2.110  feed(0.04)   → state Pausing, pauseStart=2.110
t=2.142  feed(0.02)   → silent, count=2/32

t=3.110  feed(0.01)   → silent ≥ 1.0s

emit Chunk {
  range:  0.180 ... 2.110          // chunkStart - 0.300 (preroll) ... pauseStart
  text:   <to be transcribed>
  index:  1
}

state → Idle, chunkStart=nil`
    };

    case "chunk": return {
      title: "Заголовок m4a-чанка",
      badge: "audio/mp4 container",
      body:
`MP4 box hierarchy (~37 KB чанк ≈ 1.93 секунды речи):

ftyp:                  isom + mp42
moov:
  mvhd:                timescale=16000, duration=30880
  trak:
    tkhd:              track_id=1
    mdia:

      hdlr:            soun

              esds:    AAC LC, bitrate=32000

# В коде: AVAssetWriter → AVAssetWriterInput → AVAssetWriterInputPullStyleAdaptor
# Никаких файлов на диске: пишем в AVAssetWriter с временным URL,

    case "gemini1": return {

    };

    case "geminiN": return {
      title: `HTTP-запрос к Gemini (chunk ${state.chunk === 'final' ? 'final' : state.chunk}, v2 формат)`,
      badge: state.chunk === "1" ? "POST · no cache (это первый чанк)" : "POST · ≈ 90% cached",

    };

    case "final": return {

    };

    case "concat": return {
      title: "Стыковка + client-side cleanup",
      badge: "v2: finalizeForInsertion",
      body:
`# Шаг 1 — наивная склейка:
chunk_1.text  =  "the timeline looks tight but doable"

  if (t.length === 0) return `  → пустой → continuesMidSentence=false → точка остаётся.`;
  const c = t[0];

  if (isLow) return `  → начинается со строчной "${c}" → continuesMidSentence=true → точка снимается.`;
  if ([",", ";", ":", "—", "-"].includes(c)) return `  → начинается с "${c}" → continuesMidSentence=true → точка снимается.`;

NSPasteboard.general.setString(
    "<сюда уходит результат finalizeForInsertion(stitched, textAfterCursor)>",

)

# t=1ms:      synthesize ⌘V
src  = CGEventSource(stateID: .combinedSessionState)
down = CGEvent(keyboardEventSource: src, virtualKey: 9, keyDown: true)
down.flags = .maskCommand
down.post(tap: .cgAnnotatedSessionEventTap)
up   = CGEvent(keyboardEventSource: src, virtualKey: 9, keyDown: false)

# t=1ms…151ms:  appkit/Electron read pasteboard, paste handled

NSPasteboard.general.writeObjects(items)

    };

    case "history": return {

      body:
`[
  {
    "id": "F4D8A3E1-7C92-4B1F-A4D2-3E8F7B6C9A1D",
    "text": "the timeline looks tight but doable could you double-check the QA window and ping me on Slack",

  }
}

/* ──────────────────────────────────────────────────────────────────
   Рендер
   ────────────────────────────────────────────────────────────────── */

function renderSteps() {
  const ul = document.getElementById("steps");
  ul.innerHTML = STEPS.map((s, i) => `
    <li class="step ${s.id === state.step ? 'active' : ''} ${stepIndex(state.step) > i ? 'passed' : ''}" data-id="${s.id}">
      <span class="num">${String(i + 1).padStart(2, '0')}</span>
      <span class="label">${s.label}${s.changed ? '<span class="changed" title="изменено в v2"></span>' : ''}<small class="sub">${s.sub}</small></span>
    </li>
  `).join("");
  ul.querySelectorAll(".step").forEach(el => {
    el.onclick = () => { state.step = el.dataset.id; updateAll(); };
  });
}

function stepIndex(id) { return STEPS.findIndex(s => s.id === id); }

function renderStage() {
  document.getElementById("stage").innerHTML = stepContent(state.step);
  if (state.step === "vad") drawWave("wave-vad", false);
  if (state.step === "chunk") drawWave("wave-chunk", true);
}

function drawWave(elId, withPreroll) {
  const el = document.getElementById(elId);
  if (!el) return;
  const N = 80;
  el.innerHTML = "";
  for (let i = 0; i < N; i++) {
    const div = document.createElement("div");
    div.className = "bar";
    let h, klass = "";
    if (withPreroll) {
      if (i < 12)            { klass = "preroll";  h = 14 + Math.random() * 8;  }
      else if (i < 65)       { klass = "voiced";   h = 12 + Math.random() * 38; }
      else                   { klass = "";         h = 4 + Math.random() * 6;   }
    } else {
      const block = Math.floor(i / 12);
      if (block % 2 === 0)   { klass = "voiced";   h = 12 + Math.random() * 38; }
      else                   { klass = "";         h = 4 + Math.random() * 8;   }
    }
    if (klass) div.classList.add(klass);
    div.style.height = h + "px";
    el.appendChild(div);
  }
}

function renderPrompt() {
  const p = promptFor(state.step);
  document.getElementById("prompt-title").textContent = p.title;
  document.getElementById("prompt-badge").textContent = p.badge;
  const body = document.getElementById("prompt");
  if (state.step === "gemini1" || state.step === "geminiN" || state.step === "final") {
    body.innerHTML = highlightJSON(p.body);
  } else {
    body.innerHTML = highlightSwift(p.body);
  }
}

function updateAll() {
  renderSteps();
  renderStage();
  renderPrompt();
}

/* ──────────────────────────────────────────────────────────────────
   Контролы
   ────────────────────────────────────────────────────────────────── */

document.querySelectorAll("#chunk-control button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#chunk-control button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.chunk = btn.dataset.chunk;
    if (state.chunk !== "1" && state.step === "gemini1") state.step = "geminiN";
    if (state.chunk === "final") state.step = "final";
    updateAll();
  };
});

document.querySelectorAll("#app-control button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#app-control button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.app = btn.dataset.app;
    updateAll();
  };
});

document.getElementById("copy").onclick = async () => {
  const btn = document.getElementById("copy");
  const text = document.getElementById("prompt").innerText;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Скопировано";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "Копировать";
      btn.classList.remove("copied");
    }, 1500);
  } catch (e) {
    btn.textContent = "Ошибка";
  }
};

// keyboard nav
document.addEventListener("keydown", (e) => {
  const idx = stepIndex(state.step);
  if (e.key === "ArrowDown" || e.key === "ArrowRight") {
    if (idx < STEPS.length - 1) { state.step = STEPS[idx + 1].id; updateAll(); }
    e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
    if (idx > 0) { state.step = STEPS[idx - 1].id; updateAll(); }
    e.preventDefault();
  }
});

updateAll();
</script>
