name: NoType
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  NoType:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NoType
        excludes:
          - "**/*.md"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notype
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "49T6U8DQXZ"
        INFOPLIST_FILE: NoType/Info.plist
        # Entitlements carry ONLY unrestricted keys today (audio-input,
        # app-sandbox=false). `keychain-access-groups` was removed in 0.1.12:
        # it is a RESTRICTED entitlement, and a bundle declaring one without an
        # embedded provisioning profile is SIGKILLed by AMFI before main().
        # 0.1.11 shipped exactly that and could not launch anywhere.
        # Do not add a restricted entitlement here without also embedding a
        # profile — see the comment in NoType/NoType.entitlements and the AMFI
        # gate in scripts/release.sh.
        CODE_SIGN_ENTITLEMENTS: NoType/NoType.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Pass a stable designated requirement to the standard Xcode codesign
          # step so TCC keys the Accessibility/Microphone grants on bundle ID
          # only — surviving cdhash changes between dev rebuilds.
          OTHER_CODE_SIGN_FLAGS: --requirements=$(PROJECT_DIR)/signing/NoType.xcrequirements

  NoTypeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NoTypeTests
    dependencies:
      - target: NoType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notype.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # Match the main app's signing identity so the XCTest bundle can
        # be dlopen'd into NoType.app's process. Without an explicit
        # team here xcodegen falls through to ad-hoc personal-team
        # signing for the test bundle, while NoType.app is signed with
        # the team below — and macOS refuses to load a bundle whose
        # Team ID differs from its host process.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "49T6U8DQXZ"

schemes:
  NoType:
    build:
      targets:
        NoType: all
        NoTypeTests: [test]
    test:
      targets:
        - NoTypeTests
      gatherCoverageData: false
