name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (macOS)
    # NoType's deployment target is macOS 14 (Sonoma) — see ADR-001 in
    # docs/decisions.md. GitHub-hosted `macos-latest` runners (currently
    # macOS 15 / Xcode 16) link against the macOS 15 SDK; that's fine
    # because the codebase doesn't reach for any macOS 26-only symbols.
    # A future change that adds 26-only API must be guarded with
    # `@available(macOS 26, *)` to keep this job green.
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Disable code signing for the CI build — runners don't have our
      # Developer ID certificate in keychain (signing is only set up in
      # release.yml). The compiled `.app` isn't shipped from this job; it
      # just verifies that the code compiles and tests pass.
      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project NoType.xcodeproj \
            -scheme NoType \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project NoType.xcodeproj \
            -scheme NoType \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test
