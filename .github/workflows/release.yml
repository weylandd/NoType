name: Release

# ┌──────────────────────────────────────────────────────────────────┐
# │ DISABLED as of 2026-05-12 — GitHub-hosted `macos-latest` runners │
# │ are still on macOS 15 / Xcode 16 and reject our 26.0 deployment  │
# │ target with: "supported deployment target versions is 10.13 to   │
# │ 15.5.99". Releases happen locally via:                            │
# │   ./scripts/release.sh                                            │
# │   ./scripts/publish_release.sh                                    │
# │ (see docs/build.md "Cutting a release"). Re-enable the `push:    │
# │ tags: ['v*']` trigger below once `macos-26` images are available.│
# └──────────────────────────────────────────────────────────────────┘
on:
  # push:
  #   tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Commit docs/appcast.xml back to main + create GitHub Release.

# Prevent two releases for the same tag from racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, publish
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (at the tag)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history — needed for `git checkout main` later

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Sparkle CLI tools (sign_update)
        env:
          SPARKLE_VERSION: "2.6.4"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          # `sign_update` lands at /tmp/sparkle/bin/sign_update.
          echo "/tmp/sparkle/bin" >> "$GITHUB_PATH"
          /tmp/sparkle/bin/sign_update --help || true

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          p12-password:    ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}

      - name: Verify signing identity is available
        run: |
          security find-identity -p codesigning -v
          security find-identity -p codesigning -v \
            | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity found" >&2; exit 1; }

      - name: Setup notarytool keychain profile
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID:            ${{ secrets.TEAM_ID }}
        run: |
          # scripts/release.sh calls `notarytool submit --keychain-profile notype-notary`.
          # The profile must exist in the default keychain before then.
          xcrun notarytool store-credentials notype-notary \
            --apple-id "$APPLE_ID" \
            --team-id  "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Verify tag matches Info.plist version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" NoType/Info.plist)
          echo "Tag version:     $TAG_VERSION"
          echo "Info.plist:      $PLIST_VERSION"
          if [[ "$TAG_VERSION" != "$PLIST_VERSION" ]]; then
            echo "::error::Tag v${TAG_VERSION} doesn't match CFBundleShortVersionString (${PLIST_VERSION}). Bump Info.plist and re-tag." >&2
            exit 1
          fi

      - name: Build, sign, notarize, package (.app + .dmg + .zip)
        run: scripts/release.sh

      - name: Resolve build artefacts
        id: artefacts
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" NoType/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" NoType/Info.plist)
          DMG="build/NoType-${VERSION}.dmg"
          ZIP="build/NoType-${VERSION}.zip"
          for f in "$DMG" "$ZIP"; do
            test -f "$f" || { echo "::error::missing $f" >&2; exit 1; }
          done
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "dmg=$DMG"
            echo "zip=$ZIP"
          } >> "$GITHUB_OUTPUT"
          ls -lh "$DMG" "$ZIP"

      - name: Sign update + publish appcast on main
        env:
          ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION:        ${{ steps.artefacts.outputs.version }}
          BUILD:          ${{ steps.artefacts.outputs.build }}
          ZIP:            ${{ steps.artefacts.outputs.zip }}
        run: |
          set -euo pipefail

          # 1. Sign the Sparkle zip with the EdDSA private key from secrets.
          KEY_FILE="$(mktemp)"
          # Use printf to preserve newlines if the key is multi-line. The
          # secret is the verbatim output of `generate_keys -x` (base64).
          printf "%s\n" "$ED_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          # sign_update prints exactly one line: `sparkle:edSignature="..." length="..."`.
          SIG_LINE=$(sign_update -f "$KEY_FILE" "$ZIP")
          shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"
          echo "Signature line: $SIG_LINE"

          # 2. Switch to main (fast-forwarded) and apply the appcast change there.
          #    Building from the tag's commit guarantees Info.plist is the
          #    correct version; the appcast file itself only lives on main.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          scripts/sparkle_appcast_item.sh \
            --version   "$VERSION" \
            --build     "$BUILD" \
            --signature "$SIG_LINE" \
            --notes-file CHANGELOG.md \
            --output-appcast docs/appcast.xml

          if [[ -n "$(git status --porcelain docs/appcast.xml)" ]]; then
            git add docs/appcast.xml
            git commit -m "chore(release): publish ${GITHUB_REF_NAME} appcast"
            git push origin main
          else
            echo "::warning::appcast.xml unchanged — was the version already published?"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artefacts.outputs.dmg }}
            ${{ steps.artefacts.outputs.zip }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: false
          # Treat any tag with a hyphen (v0.1.2-rc1, v0.2.0-beta) as a prerelease.
          # Sparkle will still surface them unless we add a separate prerelease
          # appcast in the future — fine for now.
          prerelease: ${{ contains(github.ref_name, '-') }}
