# Pre-commit hooks for NoType.
#
# One-time setup:
#   brew install pre-commit
#   pre-commit install
#
# After install, hooks run automatically on `git commit`. Run on the whole
# tree with:
#   pre-commit run --all-files
#
# Hooks here are intentionally minimal — they catch common mistakes (secrets,
# whitespace, broken JSON/YAML) without forcing a heavy lint pipeline.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
